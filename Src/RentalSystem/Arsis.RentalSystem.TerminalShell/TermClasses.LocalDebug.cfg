<?xml version="1.0" encoding="windows-1251"?>
<!--For more information on using transformations see the web.config examples at http://go.microsoft.com/fwlink/?LinkId=214134. -->
<TermDevices
	xmlns:xdt="http://schemas.microsoft.com/XML-Document-Transform"
	xdt:Transform="Replace">

	<BillValidator>
		<Parameters
		  DebugLevel = "3"
		  ComPortName = "COM6"
		  ComPortBaudRate = "9600"
		  ComPortReadTimeout = "1500"
		/>
		<PermissibleNominals>
			<Nominal Value="10"   Code="2" />
			<Nominal Value="50"   Code="3" />
			<Nominal Value="100"  Code="4" />
			<Nominal Value="500"  Code="5" />
			<Nominal Value="1000" Code="6" />
		</PermissibleNominals>
	</BillValidator>

	<FiscalRegistrator>
		<Parameters
		  DebugLevel = "3"
		  ComPortName = "COM5"
		  ComPortBaudRate = "115200"
		  ComPortReadTimeout = "100"
		/>
	</FiscalRegistrator>

</TermDevices>